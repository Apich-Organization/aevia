[workspace]
resolver = "3"
members = [
    "crates/aevia-dim",
    "crates/aevia-syntax",
    "crates/aevia-types",
    "crates/aevia-ir",
    "crates/aevia-resolve",
    "crates/aevia-core",
    "crates/aevia-rssn",
    "crates/aevia-std",
    "crates/aevia-stdlib-model",
    "crates/aevia-fmt",
    "crates/aevia-doc",
    "crates/aevia-analysis",
    "crates/aevia-lint",
    "crates/aevia-lsp",
    "crates/aevia-cli",
    "tools/aevia-stdlib-gen",
    "tools/rssn-api-audit",
    "tools/aevia-prof",
]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/Apich-Organization/aevia"

[workspace.dependencies]
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-integer = "0.1"
num-traits = "0.2"
indexmap = { version = "2", features = ["serde"] }
unicode-ident = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
# Native encoding and schema fingerprinting for the checked-module cache.
bincode-next = "3.2"

aevia-dim = { path = "crates/aevia-dim" }
aevia-syntax = { path = "crates/aevia-syntax" }
aevia-types = { path = "crates/aevia-types" }
aevia-stdlib-model = { path = "crates/aevia-stdlib-model" }
aevia-ir = { path = "crates/aevia-ir" }
aevia-resolve = { path = "crates/aevia-resolve" }
aevia-core = { path = "crates/aevia-core" }
aevia-rssn = { path = "crates/aevia-rssn" }
aevia-fmt = { path = "crates/aevia-fmt" }
aevia-doc = { path = "crates/aevia-doc" }
aevia-analysis = { path = "crates/aevia-analysis" }
aevia-lint = { path = "crates/aevia-lint" }
aevia-lsp = { path = "crates/aevia-lsp" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
debug = false
debug-assertions = false
overflow-checks = false
incremental = true

# Keep source locations in test backtraces without copying full dependency
# variable/type debug information into every integration-test executable.
# RSSN links a large scientific kernel; full debug info multiplies disk and
# linker memory costs across the workspace's independent test targets.
[profile.test]
debug = "line-tables-only"

# The same reason applies to a debug `aevia` binary: full debug info for the
# kernel and its numeric dependencies pushed the MSVC program database past
# its limits (LNK1140/LNK1318). Workspace crates keep full debug info.
[profile.dev.package."*"]
debug = "line-tables-only"

# Optimised but quick to rebuild: for measuring the interpreter while working
# on it (`cargo build --profile profiling -p aevia-cli`). Release numbers are
# still the ones to quote.
[profile.profiling]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
debug = "line-tables-only"

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
improper_ctypes_definitions = "deny"
unreachable_code = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
implicit_clone = "deny"
missing_safety_doc = "deny"
same_item_push = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
