name = "Aevia"
grammar = "aevia"
path_suffixes = ["aev"]
line_comments = ["# ", "## "]
first_line_pattern = '^#!.*\baevia\b'
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "(", end = ")", close = true, newline = false },
    { start = "[", end = "]", close = true, newline = false },
    { start = "{", end = "}", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
word_characters = ["'"]
tab_size = 4
hard_tabs = false
