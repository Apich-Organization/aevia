name: Editor packages

"on":
  workflow_call:

permissions:
  contents: read

jobs:
  packages:
    name: VS Code and JetBrains packages
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: aevia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aevia
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aevia/editors/vscode/package-lock.json
      - name: Test and package the VS Code extension
        working-directory: aevia/editors/vscode
        run: |
          npm ci --ignore-scripts
          node --check extension.js
          npm test
          node -e 'JSON.parse(require("node:fs").readFileSync("syntaxes/aevia.tmLanguage.json", "utf8"))'
          mkdir -p ../../dist/editor-extensions
          npm run package -- --out ../../dist/editor-extensions
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.14.3'
      - name: Package the JetBrains plugin
        working-directory: aevia/editors/jetbrains
        run: |
          gradle --no-daemon buildPlugin verifyPluginStructure
          cp build/distributions/*.zip ../../dist/editor-extensions/
      - name: Verify editor package contents
        run: python3 editors/test/packages.py dist/editor-extensions
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aevia-editor-extensions
          if-no-files-found: error
          path: |
            aevia/dist/editor-extensions/*.vsix
            aevia/dist/editor-extensions/*.zip
