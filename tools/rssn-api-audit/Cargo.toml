[package]
name = "rssn-api-audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["jit", "gpu-wgpu", "npy"]
jit = ["rssn/jit"]
gpu-wgpu = ["rssn/gpu-wgpu"]
npy = ["rssn/npy"]

[dependencies]
rssn-api-model = { path = "../../../rssn/tools/rssn-api-model" }
rssn = { path = "../../../rssn", default-features = false }
syn = { version = "2", features = ["full", "visit"] }
quote = "1"

[lints]
workspace = true
