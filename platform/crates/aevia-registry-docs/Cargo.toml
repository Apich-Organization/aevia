[package]
name = "aevia-registry-docs"
description = "Renders aevia-doc output into the pages the documentation site serves"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The documentation site uses the language parser and formatter by default.
# Disabling this feature selects the fallback renderer. Cargo still needs the
# language workspace manifests to resolve local dependencies.
default = ["compiler"]
compiler = ["dep:aevia-doc", "dep:aevia-syntax"]

[dependencies]
aevia-registry-core.workspace = true
ammonia.workspace = true
aevia-doc = { workspace = true, optional = true }
aevia-syntax = { workspace = true, optional = true }
pulldown-cmark.workspace = true
tracing.workspace = true

[lints]
workspace = true
