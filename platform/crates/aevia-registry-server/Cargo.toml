[package]
name = "aevia-registry-server"
description = "The aevia.apich.org server: registry API, accounts and documentation site"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "aevia_registry"
path = "src/lib.rs"

[[bin]]
name = "aevia-registry"
path = "src/main.rs"

[dependencies]
aevia-registry-core.workspace = true
aevia-registry-db.workspace = true
aevia-registry-docs.workspace = true
aevia-registry-web.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
hex.workspace = true
jsonwebtoken = "9"
rand.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
