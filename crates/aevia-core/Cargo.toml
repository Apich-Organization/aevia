[package]
name = "aevia-core"
description = "Values, interpreter and tensor runtime for the Aevia language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aevia-dim.workspace = true
aevia-syntax.workspace = true
aevia-types.workspace = true
aevia-ir.workspace = true
aevia-rssn.workspace = true
aevia-std = { path = "../aevia-std" }
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true
indexmap.workspace = true

[[bench]]
name = "interp"
harness = false

[lints.rust]
# No production code may use `unsafe`. `deny` (not `forbid`) is what lets the
# allocation gate test install a counting `#[global_allocator]`, whose impl is
# necessarily `unsafe`; that file is the only place allowed to opt back in, and
# it forwards every operation to `System` with a SAFETY comment.
unsafe_code = "deny"
