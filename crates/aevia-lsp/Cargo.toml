[package]
name = "aevia-lsp"
description = "Language Server Protocol adapter for Aevia, over the aevia-analysis core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aevia-lsp"
path = "src/main.rs"

# The whole point of the split: this crate is the only one that knows what a
# client is, and it knows nothing the analysis crate does not tell it.
[dependencies]
aevia-analysis.workspace = true
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"
